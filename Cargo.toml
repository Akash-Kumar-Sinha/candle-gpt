[package]
name = "candle-gpt"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "candle-gpt"
path = "src/main.rs"

[workspace]
members = ["candle-weights","tensor", "candle-tokenizer", "embeddings"]
resolver = "3"

[workspace.dependencies]
thiserror = "2.0.20"
rayon = "1.12.0"
tensor = {path = "./tensor"}
embeddings = {path = "./embeddings"}
candle-tokenizer = {path = "./candle-tokenizer"}
candle-weights = {path = "./candle-weights"}

[dependencies]
candle-tokenizer.workspace = true
embeddings = { workspace = true }
